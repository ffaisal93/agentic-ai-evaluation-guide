[book]
title = "Agentic AI Evaluation — A Practical Guide"
authors = ["Fahim Faisal"]
description = "Frameworks, metrics, benchmarks, tool-use and safety evaluation, and production monitoring for agentic AI systems."
language = "en"
src = "."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ffaisal93/agentic-ai-evaluation-guide"
edit-url-template = "https://github.com/ffaisal93/agentic-ai-evaluation-guide/edit/main/{path}"
mathjax-support = true
no-section-label = true
additional-css = ["custom.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true
